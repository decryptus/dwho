name: Foundation regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  redis:
    name: Redis integration (${{ matrix.redis }}, ${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - redis: '5.0.14-alpine'
            python: '3.12'
            client: redis
            url: 'redis://127.0.0.1:6379/0?protocol=2'
          - redis: '7.2.6-alpine'
            python: '3.12'
            client: redis
            url: 'redis://127.0.0.1:6379/0'
          - redis: '5.0.14-alpine'
            python: '3.9'
            client: redis==2.10.6
            url: 'redis://127.0.0.1:6379/0'
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . '${{ matrix.client }}'
      - name: Verify SET compatibility, stream IDs, retention and wrong-type errors
        env:
          DWHO_REDIS_TEST_URL: ${{ matrix.url }}
        run: |
          cd "$(mktemp -d)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_redis_integration.py -v

  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 2860136a9e6b6a2890ad36d136493e530fb44ca5
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: 22a9ebdd6ac014df68ae40f891e16742cb1c4fa9
          path: dependencies/httpdis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . dependencies/sonicprobe dependencies/httpdis mock
      - name: Test the installed package outside the checkout
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7.18', '3.5', '3.6', '3.7', '3.8', '3.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 2860136a9e6b6a2890ad36d136493e530fb44ca5
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: 22a9ebdd6ac014df68ae40f891e16742cb1c4fa9
          path: dependencies/httpdis
          persist-credentials: false
      - name: Install and test with the legacy interpreter
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro"
          python:${{ matrix.python }}
          bash /src/.github/scripts/test-legacy.sh
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 2860136a9e6b6a2890ad36d136493e530fb44ca5
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: 22a9ebdd6ac014df68ae40f891e16742cb1c4fa9
          path: dependencies/httpdis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/covenant
          ref: 59b72ef4ef7987465c840e39215badc87f52eefa
          path: consumers/covenant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/auton
          ref: c98565679ad1738ad51321089dcfaee6e16a6fa8
          path: consumers/auton
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . dependencies/sonicprobe dependencies/httpdis covenant==0.0.70
      - run: AUTON_PACKAGE=autond python -m pip install ./consumers/auton
      - run: AUTON_PACKAGE=auton python -m pip install ./consumers/auton
      - name: Covenant regressions
        working-directory: consumers/covenant
        run: python -m unittest discover -s tests -v
      - name: Auton regressions
        working-directory: consumers/auton
        run: python -m unittest discover -s tests -v
      - name: Load consumer plugins through the installed dwho loader
        run: |
          python .github/scripts/check-consumer-plugins.py covenant
          python .github/scripts/check-consumer-plugins.py auton


  isolated-contexts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: 22a9ebdd6ac014df68ae40f891e16742cb1c4fa9
          path: dependencies/httpdis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . dependencies/httpdis sonicprobe==0.3.53 mock
      - name: Verify installed runtime with candidate HTTPdis contexts
        run: |
          cd "$(mktemp -d)"
          python -c 'from httpdis.httpdis import HttpServerContext'
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_runtime.py -v

