name: Foundation regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 39caf71b8bcbfd2a04cd9775a7b721071face4b0
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: a0feecf580c82a2030b61033b5e78079f15e2736
          path: dependencies/httpdis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . dependencies/sonicprobe dependencies/httpdis mock
      - name: Test the installed package outside the checkout
        run: |
          cd "$(mktemp -d)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7.18', '3.5', '3.6', '3.7', '3.8', '3.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 39caf71b8bcbfd2a04cd9775a7b721071face4b0
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: a0feecf580c82a2030b61033b5e78079f15e2736
          path: dependencies/httpdis
          persist-credentials: false
      - name: Install and test with the legacy interpreter
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro"
          python:${{ matrix.python }}
          bash /src/.github/scripts/test-legacy.sh
